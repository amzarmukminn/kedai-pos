<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kedai POS — Dashboard</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./pos-config.js"></script><style>body{font-family:Inter,system-ui;background:#f8fafc}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px}.rise{animation:rise .35s ease both}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}tr{border-bottom:1px solid #f1f5f9}</style></head><body class="text-slate-800"><main class="max-w-7xl mx-auto p-4 md:p-8"><header class="flex flex-wrap gap-4 justify-between items-center mb-7"><div><p class="text-sm text-emerald-700 font-semibold">Kedai POS</p><h1 class="text-3xl font-bold">Dashboard & Audit</h1><p id="identity" class="text-sm text-slate-500 mt-1"></p></div><div class="flex gap-2"><a href="./index.html" class="px-4 py-2 rounded-lg border bg-white">← Kembali ke POS</a><button onclick="load()" class="px-4 py-2 rounded-lg bg-emerald-600 text-white">Muat semula</button></div></header><section class="card p-4 mb-5 flex flex-wrap gap-3 items-end"><label class="text-sm">Dari<input id="from" type="date" class="block mt-1 border rounded px-3 py-2"></label><label class="text-sm">Hingga<input id="to" type="date" class="block mt-1 border rounded px-3 py-2"></label><button onclick="setRange('today')" class="px-3 py-2 text-sm border rounded">Hari ini</button><button onclick="setRange('week')" class="px-3 py-2 text-sm border rounded">Minggu ini</button><button onclick="load()" class="px-4 py-2 bg-slate-900 text-white rounded">Tapis laporan</button></section><section id="stats" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-5"></section><section class="grid lg:grid-cols-2 gap-5 mb-5"><article class="card p-5 rise"><h2 class="font-bold mb-4">Kaedah Pembayaran</h2><div id="payments" class="space-y-3"></div></article><article class="card p-5 rise"><h2 class="font-bold mb-4">Laporan Harian</h2><div id="daily" class="space-y-2 text-sm"></div></article></section><section class="card p-5 mb-5"><h2 class="font-bold mb-4">Sejarah Transaksi</h2><div class="overflow-auto"><table class="w-full text-sm"><thead class="text-left text-slate-500"><tr><th>Resit</th><th>Tarikh/Masa</th><th>Juruwang</th><th class="text-right">Jumlah</th></tr></thead><tbody id="sales"></tbody></table></div></section><section class="card p-5"><h2 class="font-bold mb-1">Audit Sejarah Stok</h2><p class="text-sm text-slate-500 mb-4">Setiap perubahan stok, sebelum/selepas, sebab dan pengguna.</p><div class="overflow-auto"><table class="w-full text-sm"><thead class="text-left text-slate-500"><tr><th>Masa</th><th>Produk</th><th>Kategori</th><th>Perubahan</th><th>Stok</th><th>Sebab</th><th>Pengguna</th></tr></thead><tbody id="moves"></tbody></table></div></section></main><script>const client=supabase.createClient(POS_CONFIG.supabaseUrl,POS_CONFIG.supabasePublishableKey);const rm=v=>'RM '+Number(v||0).toFixed(2);const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function dates(){const n=new Date(),f=new Date(n.getFullYear(),n.getMonth(),1);from.value=from.value||f.toISOString().slice(0,10);to.value=to.value||n.toISOString().slice(0,10)}function setRange(kind){const n=new Date(),s=new Date(n);if(kind==='today'){}else{s.setDate(n.getDate()-((n.getDay()+6)%7))}from.value=s.toISOString().slice(0,10);to.value=n.toISOString().slice(0,10);load()}async function load(){const {data:{session}}=await client.auth.getSession();if(!session)return location.href='./index.html';const {data:p}=await client.from('profiles').select('display_name,role,active').eq('id',session.user.id).single();if(!p?.active||!['owner','admin','auditor'].includes(p.role)){document.body.innerHTML='<main class="p-8 text-center"><h1 class="text-2xl font-bold">Akses ditolak</h1><p class="mt-2">Dashboard ini untuk Pemilik, Admin dan Juruaudit sahaja.</p><a class="text-emerald-700 underline" href="./index.html">Kembali</a></main>';return}identity.textContent=p.display_name+' · '+p.role;const {data,error}=await client.rpc('get_pos_report',{p_from:from.value,p_to:to.value});if(error)return alert(error.message);const s=data.summary||{},pay=data.payments||{};stats.innerHTML=[['Jumlah jualan',rm(s.sales_total)],['Transaksi',s.transaction_count||0],['Purata jualan',rm(s.average_sale)],['Cash / Card / QR',rm(pay.cash)+' / '+rm(pay.card)+' / '+rm(pay.duitnow)]].map(x=>'<article class="card p-5 rise"><p class="text-sm text-slate-500">'+x[0]+'</p><p class="text-2xl font-bold mt-2">'+x[1]+'</p></article>').join('');payments.innerHTML=['cash','card','duitnow'].map(k=>'<div class="flex justify-between"><span class="capitalize">'+k+'</span><b>'+rm(pay[k])+'</b></div>').join('');daily.innerHTML=(data.daily||[]).map(x=>'<div class="flex justify-between"><span>'+x.business_date+'</span><span>'+x.transactions+' transaksi · <b>'+rm(x.sales_total)+'</b></span></div>').join('')||'<p>Tiada data.</p>';sales.innerHTML=(data.sales||[]).map(x=>'<tr><td class="py-2">'+esc(x.receipt_number)+'</td><td>'+new Date(x.completed_at).toLocaleString('ms-MY')+'</td><td>'+esc(x.cashier)+'</td><td class="text-right font-semibold">'+rm(x.total)+'</td></tr>').join('')||'<tr><td colspan="4" class="py-4 text-center">Tiada transaksi.</td></tr>';moves.innerHTML=(data.stock_movements||[]).map(x=>'<tr><td class="py-2">'+new Date(x.created_at).toLocaleString('ms-MY')+'</td><td>'+esc(x.product_name)+'</td><td>'+esc(x.category)+'</td><td class="'+(x.quantity_delta>0?'text-emerald-700':'text-rose-700')+'">'+(x.quantity_delta>0?'+':'')+x.quantity_delta+'</td><td>'+x.quantity_before+' → '+x.quantity_after+'</td><td>'+esc(x.reason||'-')+'</td><td>'+esc(x.performed_by)+'</td></tr>').join('')||'<tr><td colspan="7" class="py-4 text-center">Tiada perubahan stok.</td></tr>';lucide.createIcons()}dates();load();</script></body></html>
